### Autostart ###

# Secrets / privilege prompts
exec-once = gnome-keyring-daemon --start --components=secrets
# Prefer hyprpolkitagent when installed; fall back to GNOME polkit agent.
exec-once = sh -c 'command -v hyprpolkitagent >/dev/null && exec hyprpolkitagent || exec /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1'

# Desktop portal (screenshare, file picker). systemd user units may also
# cover this; exec-once keeps a bare session honest.
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user start xdg-desktop-portal-hyprland.service xdg-desktop-portal.service

# UI + wallpaper
exec-once = swww-daemon
exec-once = waybar
exec-once = swaync

# Launcher stack (elephant backend, then walker service)
exec-once = elephant
exec-once = walker --gapplication-service

# Clipboard history (text + image)
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# IME + idle
exec-once = fcitx5
exec-once = hypridle
