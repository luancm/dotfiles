### Environment Variables ###

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
# Host-specific DPI: override in a machine-local conf if needed.
# env = GDK_DPI_SCALE,1.333
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = MOZ_ENABLE_WAYLAND,1
env = ELECTRON_OZONE_PLATFORM_HINT,wayland
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1


## Configuration Variables ###

$mainMod = SUPER
$terminal = ghostty
$fileManager = dolphin
$browser = firefox
# Walker service socket (uid-portable via XDG_RUNTIME_DIR).
$menu = nc -U $XDG_RUNTIME_DIR/walker/walker.sock
# $menu = rofi -show combi -combi-modes "window,run,calc" -modes combi
