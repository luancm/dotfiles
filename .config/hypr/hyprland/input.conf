#################
### Input Config
#################

# https://wiki.hyprland.org/Configuring/Variables/#input

input {
    # Keyboard: Add a layout and uncomment kb_options for Win+Space switching shortcut
    kb_layout = us
    kb_variant = intl
    # kb_options = grp:win_space_toggle
    numlock_by_default = true
    repeat_delay = 250
    repeat_rate = 35

    touchpad {
        natural_scroll = true
        disable_while_typing = true
        clickfinger_behavior = true
        scroll_factor = 0.5
    }
    special_fallthrough = true
    # 1 = focus follows mouse (better multi-monitor hover-to-type).
    # 2 = click to focus only.
    follow_mouse = 1
}

#############
### Keybinds
#############

# See https://wiki.hyprland.org/Configuring/Keywords/
# $mainMod and app vars live in env.conf

binds {
    scroll_event_delay = 0
}

### Apps
bind = $mainMod, T, exec, $terminal
bind = $mainMod, B, exec, $browser
bind = $mainMod, Space, exec, $menu
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, Q, killactive,

# Color picker
bind = $mainMod SHIFT, C, exec, hyprpicker -a

# Clipboard history (cliphist via Walker service socket — same path as $menu)
bind = $mainMod SHIFT, V, exec, cliphist list | walker --dmenu | cliphist decode | wl-copy

# Screenshots: region (slurp) and full outputs
bind = , Print, exec, grim -g "$(slurp)" -t ppm - | satty --filename -
bind = ALT CTRL, 4, exec, grim -g "$(slurp)" -t ppm - | satty --filename -
bind = $mainMod SHIFT, S, exec, grim -g "$(slurp)" -t ppm - | satty --filename -
bind = $mainMod SHIFT, Print, exec, grim -t ppm - | satty --filename -

### Session
# Super+L stays movefocus right (hjkl). Lock is Super+Ctrl+L.
bind = $mainMod CTRL, L, exec, loginctl lock-session
bind = $mainMod, M, exec, wlogout
# Compositor exit only via wlogout (no bare Super+Escape).

bind = $mainMod, V, togglefloating,
bind = $mainMod, P, pseudo, # dwindle
# Special/scratchpad workspace
bind = $mainMod, minus, togglespecialworkspace, magic
bind = $mainMod SHIFT, minus, movetoworkspace, special:magic

bind = $mainMod, F, fullscreen, 0
bind = $mainMod, D, fullscreen, 1
bind = ALT, Tab, cyclenext,
bind = ALT, Tab, bringactivetotop,

# Move focus with mainMod + arrow keys / hjkl
bind = $mainMod, left, movefocus, l
bind = $mainMod, h, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, l, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, k, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod, j, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Swap windows directionally (tiled) with mainMod + SHIFT + hjkl
bind = $mainMod SHIFT, H, swapwindow, l
bind = $mainMod SHIFT, L, swapwindow, r
bind = $mainMod SHIFT, K, swapwindow, u
bind = $mainMod SHIFT, J, swapwindow, d
bind = $mainMod SHIFT, left, swapwindow, l
bind = $mainMod SHIFT, right, swapwindow, r
bind = $mainMod SHIFT, up, swapwindow, u
bind = $mainMod SHIFT, down, swapwindow, d

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Window split toggle
bind = $mainMod, S, layoutmsg, togglesplit

# Window split ratio
binde = $mainMod, Equal, layoutmsg, splitratio +0.1
binde = $mainMod, Semicolon, layoutmsg, splitratio -0.1
binde = $mainMod, Apostrophe, layoutmsg, splitratio +0.1

# Multimedia: volume + brightness + playerctl
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous
bindl = , XF86AudioStop, exec, playerctl stop
