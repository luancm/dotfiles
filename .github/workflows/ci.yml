name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Install zsh, shellcheck and whiskers
        env:
          SHELLCHECK_VERSION: v0.10.0
          SHELLCHECK_SHA256: 6c881ab0698e4e6ea235245f22832860544f17ba386442fe7e9d629f8cbedf87
          WHISKERS_VERSION: v2.9.0
          WHISKERS_SHA256: 05a36866bd920af3b058856cf2b92fdd220da4c4ffbdf8a438b5efd1d14e11c7
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zsh
          tarball="shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -fsSLO "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/${tarball}"
          echo "${SHELLCHECK_SHA256}  ${tarball}" | sha256sum -c -
          tar -xJf "$tarball"
          sudo install "shellcheck-${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          curl -fsSLo whiskers "https://github.com/catppuccin/whiskers/releases/download/${WHISKERS_VERSION}/whiskers-x86_64-unknown-linux-gnu"
          echo "${WHISKERS_SHA256}  whiskers" | sha256sum -c -
          sudo install whiskers /usr/local/bin/whiskers
      - run: test/lint.sh

  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - run: test/install-smoke.sh ubuntu:24.04
